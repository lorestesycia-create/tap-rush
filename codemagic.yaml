workflows:
  android-build:
    name: Tap Rush Android
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 21

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Create Android project
        script: |
          npx cap add android || true
          npx cap sync android

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s, n = re.subn(
                  r'(<application\b[^>]*>)',
                  r'\1\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-8854680295966508~8362422277" />',
                  s,
                  count=1
              )
              if n != 1:
                  raise SystemExit("No se encontro la etiqueta application")

          p.write_text(s)
          PY

      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/**/*.apk
