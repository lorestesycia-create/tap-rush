workflows:
  android-release:
    name: Tap Rush Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 21
      android_signing:
        - tap_rush
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Create Android project
        script: |
          npx cap add android || true
          npx cap sync android

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s, n = re.subn(
                  r'(<application\b[^>]*>)',
                  r'\1\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-8854680295966508~8362422277" />',
                  s,
                  count=1
              )
              if n != 1:
                  raise SystemExit("No se encontro la etiqueta application")
              manifest.write_text(s)

          variables = Path("android/variables.gradle")
          if variables.exists():
              v = variables.read_text()
              v = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', v)
              v = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', v)
              variables.write_text(v)

          gradle = Path("android/app/build.gradle")
          g = gradle.read_text()

          g = re.sub(r'compileSdk(?:Version)?\s+\d+', 'compileSdkVersion 36', g)
          g = re.sub(r'targetSdk(?:Version)?\s+\d+', 'targetSdkVersion 36', g)

          g, n = re.subn(r'versionCode\s+\d+', 'versionCode 2', g, count=1)
          if n != 1:
              raise SystemExit("No se pudo cambiar versionCode a 2")

          if "CM_KEYSTORE_PATH" not in g:
              g = g.replace(
                  "        release {",
                  "        release {\n            signingConfig signingConfigs.release",
                  1
              )
              signing = '''\n    signingConfigs {\n        release {\n            storeFile file(System.getenv()["CM_KEYSTORE_PATH"])\n            storePassword System.getenv()["CM_KEYSTORE_PASSWORD"]\n            keyAlias System.getenv()["CM_KEY_ALIAS"]\n            keyPassword System.getenv()["CM_KEY_PASSWORD"]\n        }\n    }\n'''
              g = g.replace("    buildTypes {", signing + "\n    buildTypes {", 1)

          gradle.write_text(g)

          check_v = variables.read_text() if variables.exists() else ""
          check_g = gradle.read_text()

          if "targetSdkVersion = 36" not in check_v and not re.search(r'targetSdk(?:Version)?\s+36', check_g):
              raise SystemExit("No se pudo establecer target SDK 36")

          if not re.search(r'versionCode\s+2', check_g):
              raise SystemExit("No se pudo establecer versionCode 2")
          PY

      - name: Build signed AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab
