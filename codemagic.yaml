workflows:
  android-release:
    name: Tap Rush Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 21
      android_signing:
        - tap_rush_keystore
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Create Android project
        script: |
          npx cap add android || true
          npx cap sync android

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s, n = re.subn(
                  r'(<application\\b[^>]*>)',
                  r'\\1\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-8854680295966508~8362422277" />',
                  s,
                  count=1
              )
              if n != 1:
                  raise SystemExit("No se encontro la etiqueta application")
              manifest.write_text(s)

          gradle = Path("android/app/build.gradle")
          g = gradle.read_text()
          if "CM_KEYSTORE_PATH" not in g:
              signing = '''\n    signingConfigs {\n        release {\n            if (System.getenv()["CI"]) {\n                storeFile file(System.getenv()["CM_KEYSTORE_PATH"])\n                storePassword System.getenv()["CM_KEYSTORE_PASSWORD"]\n                keyAlias System.getenv()["CM_KEY_ALIAS"]\n                keyPassword System.getenv()["CM_KEY_PASSWORD"]\n            }\n        }\n    }\n'''
              g = g.replace("    buildTypes {", signing + "\n    buildTypes {", 1)
              g = g.replace("        release {", "        release {\n            signingConfig signingConfigs.release", 1)
              gradle.write_text(g)
          PY

      - name: Build signed AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab
