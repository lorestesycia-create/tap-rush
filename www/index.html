<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tap Rush</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101322;color:white;overflow:hidden;touch-action:manipulation}
#app{height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;padding:18px;font-weight:bold;background:#171b31}
#arena{position:relative;flex:1;overflow:hidden;background:radial-gradient(circle,#28315d,#101322 70%)}
#target{position:absolute;width:76px;height:76px;border-radius:50%;display:none;place-items:center;font-size:34px;font-weight:bold;background:#ffd23f;color:#111;box-shadow:0 0 24px #ffd23f}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px;background:#101322ee}
h1{font-size:44px;margin:0 0 10px}
.sub{opacity:.8;margin:10px 0 25px}
.btn{border:0;border-radius:16px;padding:16px 28px;font-size:20px;font-weight:bold;background:#ff3d71;color:white}
.hide{display:none}
.big{font-size:55px;font-weight:bold}
</style>
</head>
<body>

<div id="app">

<header>
<span>🏆 <b id="best">0</b></span>
<span>🪙 <b id="coins">0</b></span>
<span>⏱️ <b id="time">20</b></span>
</header>

<div id="arena">

<div id="target">⚡</div>

<div id="start" class="panel">
<h1>TAP RUSH</h1>
<div class="sub">
¿Cuánto aguantas?<br>
Toca el objetivo antes de que escape.
</div>
<button class="btn" id="play">JUGAR</button>
</div>

<div id="over" class="panel hide">
<div>RESULTADO</div>
<div class="big" id="final">0</div>
<div class="sub" id="record"></div>
<button class="btn" id="again">OTRA VEZ</button>
</div>

</div>
</div>

<script>
const arena=document.getElementById("arena");
const target=document.getElementById("target");
const start=document.getElementById("start");
const over=document.getElementById("over");

let score=0;
let left=20;
let timer
