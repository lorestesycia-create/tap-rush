<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tap Rush</title><style>
:root{font-family:system-ui,sans-serif;background:#10131c;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#10131c,#181d2b)}
#app{max-width:520px;margin:auto;padding:18px}.top,.stats,.actions{display:flex;gap:10px;justify-content:space-between;align-items:center}.card{background:#202638;border:1px solid #343c55;border-radius:18px;padding:14px}
h1{margin:0;font-size:30px}.muted{color:#aeb7cf;font-size:13px}.stats{margin:14px 0}.stat{flex:1;text-align:center}.stat b{display:block;font-size:22px}
#arena{height:430px;position:relative;overflow:hidden;background:#171c29;border:1px solid #343c55;border-radius:24px;touch-action:manipulation}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:12px}
button{border:0;border-radius:14px;min-height:48px;padding:0 16px;font-weight:800;font-size:15px;cursor:pointer}.primary{background:#7c5cff;color:#fff}.secondary{background:#2a3147;color:#fff;border:1px solid #3c4663}
.target{position:absolute;border-radius:50%;display:grid;place-items:center;font-size:28px;color:white;border:3px solid rgba(255,255,255,.7);box-shadow:0 8px 30px #0007}
.green{background:#16a66a}.red{background:#d84555}.blue{background:#3e79df}.yellow{background:#e0a82e}.hidden{display:none!important}
#banner{position:absolute;left:10px;right:10px;top:10px;text-align:center;font-weight:900;z-index:5}.actions{margin-top:12px}.actions button{flex:1}
.shop{margin-top:14px}.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.theme{background:#2a3147;color:white;padding:10px 5px;font-size:12px}
#over{margin-top:14px}.adnote{font-size:11px;color:#9ca7c2;margin-top:8px}
</style></head><body><main id="app">
<div class="top"><div><h1>⚡ TAP RUSH</h1><div class="muted">Rápido. Simple. Adictivo.</div></div><div>🪙 <b id="coins">0</b></div></div>
<div class="stats"><div class="card stat"><span class="muted">PUNTOS</span><b id="score">0</b></div><div class="card stat"><span class="muted">RÉCORD</span><b id="best">0</b></div><div class="card stat"><span class="muted">NIVEL</span><b id="level">1</b></div></div>
<section id="arena"><div id="banner"></div><div id="home" class="center"><div style="font-size:72px">🎯</div><h2>¿Cuánto aguantas?</h2><p class="muted">Supera retos rápidos. Cada ronda acelera.</p><button id="play" class="primary">JUGAR</button></div></section>
<div class="actions"><button id="sound" class="secondary">🔊 Sonido</button><button id="again" class="secondary">↻ Reiniciar</button></div>
<section id="over" class="card hidden"><h2 style="margin-top:0">Fin de partida</h2><p id="summary"></p><div class="actions"><button id="continue" class="primary">▶ Continuar · anuncio</button><button id="double" class="secondary">🪙 x2 · anuncio</button></div><div class="adnote">En Android estos botones están reservados para anuncios recompensados de AdMob.</div></section>
<section class="card shop"><b>🎨 Temas</b><div class="themes"><button class="theme" data-theme="violet">Violeta · gratis</button><button class="theme" data-theme="ocean">Océano · 50 🪙</button><button class="theme" data-theme="fire">Fuego · 100 🪙</button></div></section>

<script>
window.TapRushAds = {
  appId: "ca-app-pub-8854680295966508~8362422277",
  rewardedId: "ca-app-pub-8854680295966508/5279954200",
  interstitialId: "ca-app-pub-8854680295966508/6401464189",
  ready: false,
  async init() {
    try {
      const AdMob = window.Capacitor?.Plugins?.AdMob;
      if (!AdMob) return false;
      await AdMob.initialize();
      this.ready = true;
      return true;
    } catch(e) { console.warn("AdMob init", e); return false; }
  },
  async reward() {
    try {
      const AdMob = window.Capacitor?.Plugins?.AdMob;
      if (!AdMob || !this.ready) return false;
      await AdMob.prepareRewardVideoAd({adId:this.rewardedId,isTesting:false});
      await AdMob.showRewardVideoAd();
      return true;
    } catch(e) { console.warn("Reward ad", e); return false; }
  },
  async interstitial() {
    try {
      const AdMob = window.Capacitor?.Plugins?.AdMob;
      if (!AdMob || !this.ready) return false;
      await AdMob.prepareInterstitial({adId:this.interstitialId,isTesting:false});
      await AdMob.showInterstitial();
      return true;
    } catch(e) { console.warn("Interstitial", e); return false; }
  }
};
window.addEventListener("load",()=>window.TapRushAds.init());
</script>
<script>
const $=s=>document.querySelector(s), arena=$('#arena'); let S=JSON.parse(localStorage.getItem('taprush')||'{"coins":0,"best":0,"themes":["violet"],"theme":"violet"}');
let score=0,level=1,lives=3,running=false,timer=0,sound=true,continued=false,doubled=false,round=0;
function save(){localStorage.setItem('taprush',JSON.stringify(S))} function ui(){S.best=Math.max(S.best,score);$('#score').textContent=score;$('#best').textContent=S.best;$('#level').textContent=level;$('#coins').textContent=S.coins;save()}
function tone(f=600){if(!sound)return;try{let A=new (AudioContext||webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();g.gain.value=.035;o.frequency.value=f;o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+.06);o.onended=()=>A.close()}catch(e){}}
function clear(){clearTimeout(timer);arena.querySelectorAll('.target,.challenge').forEach(x=>x.remove())} function banner(t){$('#banner').textContent=t}
function fail(t){tone(120);lives--;banner(t+' · ❤️'.repeat(Math.max(0,lives)));clear(); if(lives<=0)setTimeout(end,450); else setTimeout(next,600)}
function target(cls,text,good=true,life=1200){let b=document.createElement('button');b.className='target '+cls;b.textContent=text;b.style.width=b.style.height=Math.max(48,78-level*2)+'px';let z=Math.max(48,78-level*2);b.style.left=Math.random()*Math.max(10,arena.clientWidth-z-8)+4+'px';b.style.top=55+Math.random()*Math.max(10,arena.clientHeight-z-65)+'px';b.onclick=()=>{if(!running)return;if(good){tone();score++;S.coins++;clear();next()}else fail('💥 Error')};arena.appendChild(b);timer=setTimeout(()=>{if(!running)return;good?fail('⏱️ Tarde'):next()},life)}
function reaction(){banner('ESPERA…');let b=document.createElement('button');b.className='target yellow';b.textContent='✋';b.style.width=b.style.height='90px';b.style.left='calc(50% - 45px)';b.style.top='180px';arena.appendChild(b);let ready=false;b.onclick=()=>ready?(score++,S.coins+=2,tone(800),clear(),next()):fail('⚠️ Demasiado pronto');timer=setTimeout(()=>{ready=true;b.className='target green';b.textContent='¡YA!';banner('¡TOCA!');timer=setTimeout(()=>fail('⏱️ Tarde'),Math.max(500,1050-level*35))},700+Math.random()*900)}
function choice(){banner('TOCA VERDE');for(let i=0;i<4;i++)target(i===0?'green':'red',i===0?'✓':'✕',i===0,Math.max(650,1350-level*45))}
function next(){if(!running)return;clear();round++;level=1+Math.floor(score/5);ui();let r=Math.random();if(r<.2)reaction();else if(r<.5)choice();else{let bomb=Math.random()<.25;banner(bomb?'NO TOQUES LA BOMBA':'¡RÁPIDO!');target(bomb?'red':'blue',bomb?'💣':'●',!bomb,Math.max(520,1450-level*55))}}
function start(reset=true){clear();if(reset){score=0;level=1;lives=3;continued=false;doubled=false;round=0}running=true;$('#home').classList.add('hidden');$('#over').classList.add('hidden');next()}
function end(){running=false;clear();S.runs=(S.runs||0)+1;if(S.runs%3===0)window.TapRushAds.interstitial();let gain=Math.max(3,Math.floor(score/2));S.coins+=gain;ui();$('#summary').textContent=`Puntuación ${score}. Has ganado ${gain} monedas.`;$('#over').classList.remove('hidden');$('#continue').disabled=continued;$('#double').disabled=doubled}
$('#play').onclick=()=>start(true);$('#again').onclick=()=>start(true);$('#sound').onclick=e=>{sound=!sound;e.target.textContent=sound?'🔊 Sonido':'🔇 Silencio'};
$('#continue').onclick=async()=>{if(continued)return;let ok=await window.TapRushAds.reward();if(!ok){banner('Anuncio no disponible. Inténtalo de nuevo.');return}continued=true;lives=1;$('#over').classList.add('hidden');running=true;next()};
$('#double').onclick=async e=>{if(doubled)return;let ok=await window.TapRushAds.reward();if(!ok){banner('Anuncio no disponible. Inténtalo de nuevo.');return}doubled=true;let n=Math.max(3,Math.floor(score/2));S.coins+=n;ui();e.target.textContent='✓ Recompensa recibida';e.target.disabled=true};
document.querySelectorAll('.theme').forEach(b=>b.onclick=()=>{let t=b.dataset.theme,cost=t==='ocean'?50:t==='fire'?100:0;if(!S.themes.includes(t)){if(S.coins<cost){banner('Necesitas más monedas');return}S.coins-=cost;S.themes.push(t)}S.theme=t;apply();ui()});
function apply(){let m={violet:['#10131c','#7c5cff'],ocean:['#071b27','#168bc5'],fire:['#24100d','#e95b34']}[S.theme]||['#10131c','#7c5cff'];document.body.style.background=`linear-gradient(${m[0]},#181d2b)`;document.querySelectorAll('.primary').forEach(x=>x.style.background=m[1])} apply();ui();
</script></main></body></html>
