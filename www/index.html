<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tap Rush</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101322;color:#fff;font-family:Arial;overflow:hidden}#app{height:100vh;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;padding:18px;background:#171b31;font-weight:bold}#arena{position:relative;flex:1;background:radial-gradient(circle,#28315d,#101322 70%);overflow:hidden}#target{position:absolute;width:70px;height:70px;border-radius:50%;background:#ffd23f;color:#111;display:none;align-items:center;justify-content:center;font-size:30px;font-weight:bold;box-shadow:0 0 22px #ffd23f}.panel{position:absolute;inset:0;background:#101322ee;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.hide{display:none}.btn{border:0;border-radius:15px;padding:16px 28px;background:#ff3d71;color:#fff;font-size:20px;font-weight:bold}h1{font-size:44px;margin:10px}.big{font-size:55px;font-weight:bold}
</style>
</head>
<body>
<div id="app">
<header><span>🏆 <b id="best">0</b></span><span>🪙 <b id="coins">0</b></span><span>⏱️ <b id="time">20</b></span></header>
<div id="arena">
<div id="target">⚡</div>
<div id="start" class="panel"><h1>TAP RUSH</h1><p>¿Cuánto aguantas?</p><button class="btn" id="play">JUGAR</button></div>
<div id="over" class="panel hide"><div>RESULTADO</div><div class="big" id="final">0</div><p id="record"></p><button class="btn" id="again">OTRA VEZ</button></div>
</div>
</div>
<script>
const $=x=>document.getElementById(x),a=$("arena"),t=$("target"),s=$("start"),o=$("over");
let best=+localStorage.best||0,coins=+localStorage.coins||0,score=0,left=20,timer,moveTimer,running=false;
function update(){$("best").textContent=best;$("coins").textContent=coins;$("time").textContent=left}
function move(){if(!running)return;let z=Math.max(45,70-score),r=a.getBoundingClientRect();t.style.width=z+"px";t.style.height=z+"px";t.style.left=Math.random()*Math.max(1,r.width-z)+"px";t.style.top=Math.random()*Math.max(1,r.height-z)+"px";clearTimeout(moveTimer);moveTimer=setTimeout(move,Math.max(280,800-score*15))}
function start(){score=0;left=20;running=true;s.classList.add("hide");o.classList.add("hide");t.style.display="flex";update();move();clearInterval(timer);timer=setInterval(()=>{left--;update();if(left<=0)end()},1000)}
function end(){running=false;clearInterval(timer);clearTimeout(moveTimer);t.style.display="none";coins+=score;if(score>best)best=score;localStorage.best=best;localStorage.coins=coins;$("final").textContent=score;$("record").textContent="Récord: "+best;update();o.classList.remove("hide")}
t.onpointerdown=e=>{e.preventDefault();if(!running)return;score++;if(navigator.vibrate)navigator.vibrate(15);move()};
$("play").onclick=start;$("again").onclick=start;update();
</script>
</body>
</html>
